<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div id="auth-container" class="w-96 bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold mb-4 text-center" id="form-title">Register</h2>
        <div id="register-form">
            <input type="text" id="name" placeholder="Name" class="w-full p-2 mb-2 border rounded">
            <input type="email" id="email" placeholder="Email" class="w-full p-2 mb-2 border rounded">
            <input type="password" id="password" placeholder="Password" class="w-full p-2 mb-2 border rounded">
            <button onclick="register()" class="w-full bg-blue-500 text-white p-2 rounded">Register</button>
            <p class="mt-2 text-sm text-center">Already have an account? <a href="#" onclick="toggleForm()" class="text-blue-500">Login</a></p>
        </div>
        <div id="login-form" class="hidden">
            <input type="email" id="login-email" placeholder="Email" class="w-full p-2 mb-2 border rounded">
            <input type="password" id="login-password" placeholder="Password" class="w-full p-2 mb-2 border rounded">
            <button onclick="login()" class="w-full bg-green-500 text-white p-2 rounded">Login</button>
            <p class="mt-2 text-sm text-center">Don't have an account? <a href="#" onclick="toggleForm()" class="text-blue-500">Register</a></p>
        </div>
    </div>
    <script src="./script.js">
      
    </script>
</body>
</html>
